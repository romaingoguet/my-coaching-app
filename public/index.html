<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coaching App - Wellness & Weekly Activities</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- API Configuration -->
    <script src="./js/config.js"></script>

</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">💚 Wellness & Weekly Activities</h1>
            <p class="text-gray-600 mt-2">Your wellness metrics and activities for this week</p>
        </header>

        <!-- Content -->
        <div id="content" class="bg-white rounded-lg shadow p-6">
            <div class="text-center py-12">
                <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">Loading your wellness data, activities, and upcoming sessions...</p>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="./js/wellness-week.js"></script>
</body>

</html>
